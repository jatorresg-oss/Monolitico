<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Retrospectivas Ágiles</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-tachometer-alt" aria-hidden="true"></i> Retrospectivas Ágiles</h1>
                <p class="subtitle">Mejora continua para equipos Scrum</p>
            </div>
        </header>

        <nav class="nav-tabs" role="tablist" aria-label="Navegación principal">
            <button class="tab-btn active" role="tab" aria-selected="true">
                <i class="fas fa-tachometer-alt" aria-hidden="true"></i> Dashboard
            </button>
            <button class="tab-btn" role="tab" aria-selected="false" onclick="navigateTo('sprints.html')">
                <i class="fas fa-calendar-alt" aria-hidden="true"></i> Sprints
            </button>
            <button class="tab-btn" role="tab" aria-selected="false" onclick="navigateTo('retrospectiva.html')">
                <i class="fas fa-comments" aria-hidden="true"></i> Retrospectiva
            </button>
            <button class="tab-btn" role="tab" aria-selected="false" onclick="navigateTo('historial.html')">
                <i class="fas fa-history" aria-hidden="true"></i> Historial
            </button>
        </nav>

        <main class="main-content" role="main" id="main-content">
            <div class="service-status" id="services-status"></div>

            <div class="panel-header">
                <h2><i class="fas fa-chart-bar" aria-hidden="true"></i> Panel de Control</h2>
            </div>

            <div class="stats-grid" id="stats-container"></div>

            <div class="panel-header">
                <h2><i class="fas fa-calendar-alt" aria-hidden="true"></i> Sprints Recientes</h2>
                <div class="panel-actions">
                    <a href="sprints.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-right" aria-hidden="true"></i> Ver todos
                    </a>
                </div>
            </div>

            <div class="sprints-list" id="recent-sprints" role="list" aria-label="Sprints recientes"></div>
        </main>
    </div>

    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="js/inicio.js"></script>
    <script>
        function navigateTo(page) { window.location.href = page; }
    </script>
</body>
</html>
