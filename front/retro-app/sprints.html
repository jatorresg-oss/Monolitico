<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Sprints</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-calendar-alt"></i> Gestión de Sprints</h1>
                <p class="subtitle">Registro de Retrospectivas Ágiles</p>
            </div>
        </header>

        <nav class="nav-tabs" role="tablist">
            <button class="tab-btn active" role="tab" onclick="location.href='sprints.html'">
                <i class="fas fa-calendar-alt"></i> Sprints
            </button>
            <button class="tab-btn" role="tab" onclick="location.href='retrospectiva.html'">
                <i class="fas fa-comments"></i> Ver retrospectiva del sprint
            </button>
            <button class="tab-btn" role="tab" onclick="location.href='historial.html'">
                <i class="fas fa-history"></i> Historial
            </button>
        </nav>

        <main class="main-content">
            <div class="panel-header">
                <h2><i class="fas fa-calendar-alt"></i> Lista de Sprints</h2>
                <button class="btn btn-primary" onclick="openSprintModal()">
                    <i class="fas fa-plus"></i> Nuevo Sprint
                </button>
            </div>

            <div class="toast-container" id="toast-container"></div>

            <div class="sprints-list" id="sprints-list"></div>
        </main>
    </div>

    <!-- Sprint Modal (igual que monolítico sprint_form.php pero en modal) -->
    <div class="modal" id="sprint-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-overlay" onclick="closeSprintModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title"><i class="fas fa-plus"></i> Nuevo Sprint</h3>
                <button class="modal-close" onclick="closeSprintModal()" aria-label="Cerrar modal">&times;</button>
            </div>
            <form id="sprint-form" novalidate>
                <input type="hidden" name="id" id="sprint-id" value="0">
                <div class="form-group">
                    <label for="nombre">Nombre del Sprint <span class="required">*</span></label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required placeholder="Ej: Sprint 1 - Autenticación">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fecha_inicio">Fecha Inicio <span class="required">*</span></label>
                        <input type="date" id="fecha_inicio" name="fecha_inicio" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha_fin">Fecha Fin <span class="required">*</span></label>
                        <input type="date" id="fecha_fin" name="fecha_fin" class="form-control" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeSprintModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="sprint-submit">
                        <i class="fas fa-save"></i> <span class="btn-text">Guardar Sprint</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/sprints.js"></script>
</body>
</html>
