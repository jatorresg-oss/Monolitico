<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Form - Retrospectivas Ágiles</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <h1 id="page-title"><i class="fas fa-plus" aria-hidden="true"></i> Agregar Item</h1>
                <p class="subtitle" id="page-subtitle">Sin sprint asignado</p>
            </div>
        </header>

        <nav class="nav-tabs" role="tablist" aria-label="Navegación principal">
            <button class="tab-btn" role="tab" aria-selected="false" onclick="navigateTo('dashboard.html')">
                <i class="fas fa-tachometer-alt" aria-hidden="true"></i> Dashboard
            </button>
            <button class="tab-btn" role="tab" aria-selected="false" onclick="navigateTo('sprints.html')">
                <i class="fas fa-calendar-alt" aria-hidden="true"></i> Sprints
            </button>
            <button class="tab-btn active" role="tab" aria-selected="true" onclick="navigateTo('retrospectiva.html')">
                <i class="fas fa-comments" aria-hidden="true"></i> Retrospectiva
            </button>
            <button class="tab-btn" role="tab" aria-selected="false" onclick="navigateTo('historial.html')">
                <i class="fas fa-history" aria-hidden="true"></i> Historial
            </button>
        </nav>

        <main class="main-content" role="main" id="main-content">
            <div class="panel-header">
                <h2 id="panel-title"><i class="fas fa-plus" aria-hidden="true"></i> Agregar Item</h2>
                <div class="panel-actions" id="panel-actions"></div>
            </div>

            <div style="max-width: 600px;">
                <form id="item-form" novalidate>
                    <input type="hidden" id="item-id" name="id">
                    <input type="hidden" id="item-retro-id" name="retrospective_id">
                    <input type="hidden" id="item-categoria" name="categoria">
                    
                    <!-- Category indicator -->
                    <div id="category-badge" class="category-badge logro" style="margin-bottom: 20px; justify-content: center; font-size: 0.875rem;">
                        <i class="fas fa-trophy" aria-hidden="true"></i> Logro
                    </div>
                    
                    <div class="form-group">
                        <label for="descripcion">Descripción <span class="required" aria-hidden="true">*</span></label>
                        <textarea id="descripcion" name="descripcion" class="form-control" required rows="5"
                                  placeholder="Describa el punto a tratar..." autofocus></textarea>
                        <p class="help-text">Escribe una descripción clara y concisa</p>
                    </div>
                    
                    <!-- Action-specific fields -->
                    <div id="action-fields" style="display: none;">
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="cumplida" name="cumplida" value="1" aria-label="Marcar acción como cumplida">
                                <span class="checkmark" aria-hidden="true"></span>
                                <span>¿Acción cumplida?</span>
                            </label>
                            <p class="help-text">Marca si esta acción ya se completó</p>
                        </div>
                        
                        <div class="form-group">
                            <label for="fecha_revision">Fecha de revisión</label>
                            <input type="date" id="fecha_revision" name="fecha_revision" class="form-control">
                            <p class="help-text">Fecha opcional para revisar el cumplimiento</p>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="#" class="btn btn-secondary" id="cancel-btn">Cancelar</a>
                        <button type="submit" class="btn btn-primary" id="submit-btn">
                            <i class="fas fa-save" aria-hidden="true"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script>
        let currentRetrospectiveId = null;
        let currentCategoria = 'positive';
        let currentItemId = null;

        const labels = {
            'positive': 'Logro',
            'negative': 'Impedimento',
            'action': 'Acción',
            'comment': 'Comentario'
        };

        const icons = {
            'positive': 'trophy',
            'negative': 'exclamation-triangle',
            'action': 'tasks',
            'comment': 'sticky-note'
        };

        const colors = {
            'positive': 'var(--success)',
            'negative': 'var(--danger)',
            'action': 'var(--primary)',
            'comment': 'var(--info)'
        };

        // Mapear categoría UI a tipo API
        const typeMap = {
            'logro': 'positive',
            'impedimento': 'negative',
            'accion': 'action',
            'comentario': 'comment'
        };

        document.addEventListener('DOMContentLoaded', async () => {
            parseURLParams();
            updateUI();
            setupForm();

            // Load item if editing from URL parameter
            if (currentItemId) await loadItem(currentItemId);
        });

        function parseURLParams() {
            const params = new URLSearchParams(window.location.search);
            currentCategoria = params.get('categoria') || 'logro';
            if (!labels[currentCategoria]) currentCategoria = 'logro';
            currentRetrospectiveId = params.get('retro_id') ? parseInt(params.get('retro_id')) : null;
            currentItemId = params.get('id') ? parseInt(params.get('id')) : null;
        }

        function updateUI() {
            // Update category badge
            const badge = document.getElementById('category-badge');
            if (badge) {
                badge.className = `category-badge ${currentCategoria}`;
                badge.innerHTML = `<i class="fas fa-${icons[currentCategoria]}" aria-hidden="true"></i> ${labels[currentCategoria]}`;
                badge.style.borderLeftColor = colors[currentCategoria];
            }

            // Show/hide action fields
            const actionFields = document.getElementById('action-fields');
            if (actionFields) {
                actionFields.style.display = currentCategoria === 'accion' ? 'block' : 'none';
            }

            // Update page title
            const isEdit = currentItemId !== null;
            document.getElementById('page-title').innerHTML =
                `<i class="fas fa-${isEdit ? 'edit' : 'plus'}" aria-hidden="true"></i> ${isEdit ? 'Modificar' : 'Agregar'} Item - ${labels[currentCategoria]}`;
            document.getElementById('panel-title').innerHTML =
                `<i class="fas fa-${isEdit ? 'edit' : 'plus'}" aria-hidden="true"></i> ${isEdit ? 'Modificar' : 'Agregar'} Item`;
            document.getElementById('submit-btn').innerHTML =
                `<i class="fas fa-save" aria-hidden="true"></i> ${isEdit ? 'Modificar' : 'Guardar'}`;

            // Update cancel button
            const cancelBtn = document.getElementById('cancel-btn');
            const retroId = currentRetrospectiveId;
            if (cancelBtn) {
                cancelBtn.href = retroId
                    ? `retrospectiva.html?sprint_id=${retroId}`
                    : 'retrospectiva.html';
            }
        }

        async function setupForm() {
            const form = document.getElementById('item-form');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const descripcion = document.getElementById('descripcion').value.trim();
                if (!descripcion) {
                    showToast('La descripción es obligatoria', 'error');
                    document.getElementById('descripcion').focus();
                    return;
                }
                if (!currentRetrospectiveId) {
                    showToast('No se indicó la retrospectiva. Vuelva a la retrospectiva.', 'error');
                    return;
                }

                const data = {
                    retrospective_id: currentRetrospectiveId,
                    type: typeMap[currentCategoria],
                    title: descripcion,
                    description: descripcion,
                    priority: 'medium',
                    order_index: 0
                };

                if (currentCategoria === 'accion') {
                    data.cumplida = document.getElementById('cumplida').checked;
                    const fecha = document.getElementById('fecha_revision').value;
                    data.due_date = fecha || null;
                }

                const submitBtn = document.getElementById('submit-btn');
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;

                try {
                    let result;
                    if (currentItemId) {
                        result = await updateFeedback(currentItemId, data);
                        showToast('Item actualizado correctamente', 'success');
                    } else {
                        result = await createFeedback(data);
                        showToast('Item creado correctamente', 'success');
                    }
                    
                    // Get the retrospective to redirect back
                    // We need the sprint_id for redirect
                    const response = await fetch(`http://localhost:3002/retrospectives/${currentRetrospectiveId}`);
                    if (response.ok) {
                        const retro = await response.json();
                        window.location.href = `retrospectiva.html?sprint_id=${retro.sprint_id}`;
                    } else {
                        window.location.href = 'retrospectiva.html';
                    }
                } catch (error) {
                    console.error('Error saving item:', error);
                    showToast(error.message || 'Error al guardar el item', 'error');
                } finally {
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });

            // Auto-resize textarea
            const textarea = document.getElementById('descripcion');
            textarea.addEventListener('input', function () {
                this.style.height = 'auto';
                this.style.height = this.scrollHeight + 'px';
            });
        }

        async function loadItem(id) {
            try {
                const response = await fetch(`http://localhost:3003/feedbacks/${id}`);
                if (!response.ok) throw new Error('No se pudo cargar el item');

                const item = await response.json();
                document.getElementById('descripcion').value = item.description || item.title;
                
                // Map API type to UI category
                currentCategoria = item.type === 'positive' ? 'logro' : 
                                  item.type === 'negative' ? 'impedimento' : 
                                  item.type === 'action' ? 'accion' : 'comentario';
                currentRetrospectiveId = item.retrospective_id;
                
                if (currentCategoria === 'accion') {
                    document.getElementById('cumplida').checked = item.cumplida === true || item.cumplida === 1;
                    document.getElementById('fecha_revision').value = item.due_date || '';
                }
                
                updateUI();
            } catch (e) {
                console.error('Error loading item:', e);
                showToast('Error al cargar el item', 'error');
            }
        }

        // API functions
        async function createFeedback(data) {
            const response = await fetch('http://localhost:3003/feedbacks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error('Error al crear');
            return response.json();
        }

        async function updateFeedback(id, data) {
            const response = await fetch(`http://localhost:3003/feedbacks/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error('Error al actualizar');
            return response.json();
        }

        async function getFeedback(id) {
            const response = await fetch(`http://localhost:3003/feedbacks/${id}`);
            if (!response.ok) throw new Error('No se pudo cargar el item');
            return response.json();
        }

        function navigateTo(page) { window.location.href = page; }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.setAttribute('role', 'alert');
            toast.setAttribute('aria-live', 'polite');
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info} toast-icon" aria-hidden="true"></i>
                <span class="toast-message">${escapeHtml(message)}</span>
                <button class="toast-close" aria-label="Cerrar notificación">&times;</button>
            `;

            toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
            container.appendChild(toast);

            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
        }
    </script>
</body>
</html>
