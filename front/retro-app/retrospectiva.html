<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Retrospectiva</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-comments"></i> Nueva Retrospectiva</h1>
                <p class="subtitle">Mejora continua para equipos Scrum</p>
            </div>
        </header>

        <nav class="nav-tabs" role="tablist">
            <button class="tab-btn" role="tab" onclick="location.href='sprints.html'">
                <i class="fas fa-calendar-alt"></i> Sprints
            </button>
            <button class="tab-btn active" role="tab" onclick="location.href='retrospectiva.html'">
                <i class="fas fa-comments"></i> Ver retrospectiva del sprint
            </button>
            <button class="tab-btn" role="tab" onclick="location.href='historial.html'">
                <i class="fas fa-history"></i> Historial
            </button>
        </nav>

        <main class="main-content">
            <div class="panel-header">
                <h2><i class="fas fa-comments"></i> Registrar Retrospectiva</h2>
            </div>

            <div class="toast-container" id="toast-container"></div>

            <!-- Sprint Selector -->
            <div class="sprint-selector">
                <label for="sprint-selector">Seleccionar Sprint:</label>
                <select id="sprint-selector" class="form-control">
                    <option value="">-- Seleccione un sprint --</option>
                </select>
            </div>

            <!-- Acciones Anteriores -->
            <div id="previous-actions"></div>

            <!-- Retrospectiva Form -->
            <div id="retro-content">
                <div class="empty-state">
                    <i class="fas fa-info-circle"></i>
                    <h3>Seleccione un sprint</h3>
                    <p>Elija un sprint del desplegable para comenzar a registrar la retrospectiva</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/retrospectiva.js"></script>
</body>
</html>
